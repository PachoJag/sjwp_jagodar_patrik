<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontaktirajte Nas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
        crossorigin="anonymous">
</head>
<body>
    <!-- navbar -->
<nav class="navbar bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center gap-2" href="#">
            
            <div
                class="feature-icon d-inline-flex align-items-center justify-content-center text-bg-primary bg-gradient">
                <img src="../Bootstrap(13.05.2026.)/briefcase.svg" alt="Briefcase" width="30" height="30">
            </div>

            <span style="font-size: 30px;">Tvrtka d.o.o.</span>

        </a>
    </div>
</nav>
<!-- grid with inputs -->
<div class="d-flex justify-content-center align-items-center min-vh-99">
    <div class="row g-1 w-100 justify-content-center">
        <div class="col-md-9 col-lg-8">
            <h4 class="mb-3" style="font-size: 30px;">Kontaktirajte Nas!</h4>
            <form class="needs-validation" novalidate="">
                <div class="row g-3">
                    <div class="col-sm-6">
                        <label for="firstName" class="form-label" style="font-size: 30px;">Ime</label>
                        <input type="text" class="form-control" id="firstName" placeholder="Patrik" value="" required="" style="font-size: 30px; height: 50px;">
                        
                    </div>
                    <div class="col-sm-6">
                        <label for="lastName" class="form-label" style="font-size: 30px;">Prezime</label>
                        <input type="text" class="form-control" id="lastName" placeholder="Jagodar" value="" required="" style="font-size: 30px; height: 50px;">
                        
                    </div>
                    <div class="col-12">
                        <label for="email" class="form-label" style="font-size: 30px;">E-mail</label>
                        <input type="email" class="form-control" id="email" placeholder="vašmail@primjer.com" value="" required="" style="font-size: 30px; height: 50px;">
                        
                    </div>
                    <div class="col-12">
                        <label for="dateSent" class="form-label" style="font-size: 30px;">Datum slanja</label>
                        <input type="date" class="form-control" id="dateSent" name="date_sent" required="" style="font-size: 30px; height: 50px;">
                        
                    </div>
                    <div class="col-12">
                        <label for="message" class="form-label" style="font-size: 30px;">Poruka</label>
                        <textarea class="form-control" id="message" name="message" rows="4" placeholder="Vaša poruka..." required="" style="font-size: 30px;"></textarea>
                        
                    </div>
                </div>
                <hr class="my-4">
                <div class="d-flex justify-content-center">
                    <a href="./zad1.html" class="btn btn-primary btn-lg">Pošalji poruku</a>
                </div>
                </form>
        </div>
    </div>
</div>
    



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
          crossorigin="anonymous"></script>
</body>
</html>
